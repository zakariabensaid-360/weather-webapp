<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-16 h-16">
  <defs>
    <!-- Background Gradient for the Sun -->
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <!-- Foreground Gradient for the Cloud -->
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <!-- Drop Shadow for Depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Sun Circle -->
  <circle cx="340" cy="180" r="90" fill="url(#sunGradient)" />

  <!-- Cloud Base with Shadow -->
  <path d="M140 380 h220 a70 70 0 0 0 0 -140 a74 74 0 0 0 -52 22 a90 90 0 0 0 -168 28 a70 70 0 0 0 0 90 z" fill="url(#cloudGradient)" filter="url(#softShadow)" />
</svg>