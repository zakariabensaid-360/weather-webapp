<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="/src/style.css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather-webapp</title>
  </head>
  <body>
    <div id="app">
      <header class="text-center flex gap-4 flex-col bg-gray-100 p-4">
        <div>
          <h1 class="text-3xl font-bold text-blue-500">Weather Application</h1>
          <p class="text-gray-500 text-xs font-light">
            Your daily outlook, at a glance.
          </p>
        </div>
        <label class="flex gap-2 justify-center items-center" for="search">
          <svg
            class="size-6 fill-blue-600"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
          >
            <!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
            <path
              d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"
            />
          </svg>
          <input
            id="search"
            type="text"
            placeholder="search by city"
            class="border border-blue-600 rounded-2xl p-2"
          />
          <button
            id="sub"
            class="bg-blue-500 text-white px-4 py-2 rounded-2xl cursor-pointer hover:bg-blue-700"
          >
            search
          </button>
        </label>
      </header>
    </div>

    <h1 class=" text-center  pt-4 text-4xl underline">Today's Weather</h1>

    <div id="today">

    </div>


    <h1 class=" text-center text-3xl underline text-blue-500">The other 5 days forcast</h1>
    <section id="weeklyWeather" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
     
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
